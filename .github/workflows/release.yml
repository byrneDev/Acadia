name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all checks pass (must run against an existing version tag)
        type: boolean
        required: false
        default: false
      sign_candidate:
        description: Require signing and notarization for a prerelease build (stable 1.x always requires both)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ACADIA_SIGN_CANDIDATE: ${{ inputs.sign_candidate == true }}

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      notes: ${{ steps.version.outputs.notes }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      production: ${{ steps.version.outputs.production }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate version, release notes, and bundled resource declarations
        id: version
        env:
          REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: node .github/scripts/release-artifacts.cjs metadata

  acceptance:
    name: Validate external production acceptance
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.metadata.outputs.production == 'true' && 'production-release' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require exact-commit human acceptance for stable 1.x
        env:
          ACADIA_RELEASE_ACCEPTANCE: ${{ vars.ACADIA_RELEASE_ACCEPTANCE }}
        run: node .github/scripts/release-artifacts.cjs acceptance
      - name: Retain production acceptance evidence
        if: needs.metadata.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-acceptance
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package and test (${{ matrix.platform }})
    needs: [metadata, acceptance]
    environment: ${{ needs.metadata.outputs.production == 'true' && 'production-release' || 'release-candidate' }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            script: package:linux
            executable: linux-unpacked/acadia
          - os: macos-15
            platform: macos-arm64
            script: package:mac
            executable: mac-arm64/Acadia.app/Contents/MacOS/Acadia
          - os: windows-2025
            platform: windows-x64
            script: package:win
            executable: win-unpacked/Acadia.exe
    env:
      ACADIA_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      ACADIA_RELEASE_PLATFORM: ${{ matrix.platform }}
      ACADIA_PACKAGE_SCRIPT: ${{ matrix.script }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Prepare Ubuntu desktop test environment
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-linux-ci.sh
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run unit and research acceptance tests
        run: npm test
      - name: Build native package without publishing
        env:
          REQUIRE_SIGNING: ${{ needs.metadata.outputs.signing }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.metadata.outputs.signing == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && needs.metadata.outputs.signing == 'true' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && needs.metadata.outputs.signing == 'true' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && needs.metadata.outputs.signing == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && needs.metadata.outputs.signing == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && needs.metadata.outputs.signing == 'true' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && needs.metadata.outputs.signing == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && needs.metadata.outputs.signing == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [[ "$ACADIA_PACKAGE_SCRIPT" == "package:linux" ]]; then
            npm run "$ACADIA_PACKAGE_SCRIPT"
          elif [[ "$REQUIRE_SIGNING" == "true" && "$RUNNER_OS" == "macOS" ]]; then
            for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!credential}" ]]; then echo "Missing required macOS distribution signing/notarization credential: $credential" >&2; exit 1; fi
            done
            npm run "$ACADIA_PACKAGE_SCRIPT" -- --publish never --config.forceCodeSigning=true --config.mac.identity= --config.mac.hardenedRuntime=true --config.mac.notarize=true
          elif [[ "$REQUIRE_SIGNING" == "true" && "$RUNNER_OS" == "Windows" ]]; then
            for credential in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
              if [[ -z "${!credential}" ]]; then echo "Missing required Windows distribution signing credential: $credential" >&2; exit 1; fi
            done
            npm run "$ACADIA_PACKAGE_SCRIPT" -- --publish never --config.forceCodeSigning=true
          else
            npm run "$ACADIA_PACKAGE_SCRIPT" -- --publish never
          fi
      - name: Install Ubuntu package and its sandbox profile
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --yes "./release/v$ACADIA_RELEASE_VERSION/Acadia-$ACADIA_RELEASE_VERSION-linux-x64.deb"
          test -x /opt/Acadia/acadia
          test -f /usr/share/applications/acadia.desktop
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            test -f /etc/apparmor.d/acadia
          fi
      - name: Test installed Electron application on Ubuntu
        if: runner.os == 'Linux'
        env:
          ACADIA_TEST_EXECUTABLE: /opt/Acadia/acadia
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
      - name: Test packaged Electron application on macOS or Windows
        if: runner.os != 'Linux'
        env:
          ACADIA_TEST_EXECUTABLE: ${{ github.workspace }}/release/v${{ needs.metadata.outputs.version }}/${{ matrix.executable }}
        run: npm run test:e2e
      - name: Archive macOS application with executable permissions
        if: runner.os == 'macOS'
        run: |
          release_dir="release/v$ACADIA_RELEASE_VERSION"
          ditto -c -k --sequesterRsrc --keepParent "$release_dir/mac-arm64/Acadia.app" "$release_dir/Acadia-$ACADIA_RELEASE_VERSION-macOS-arm64.zip"
      - name: Validate packages and stage checksummed assets
        run: node .github/scripts/release-artifacts.cjs stage
      - name: Save release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Save packaged application test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tests-${{ matrix.platform }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify all release assets
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACADIA_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets/
          merge-multiple: true
      - name: Verify platform manifests and create combined checksums
        run: node .github/scripts/release-artifacts.cjs verify
      - name: Save verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distribution
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish verified GitHub release
    needs: [metadata, acceptance, verify]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distribution
          path: release-assets/
      - name: Verify downloaded assets before publication
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish a new release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_NOTES: ${{ needs.metadata.outputs.notes }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.deb release-assets/*.AppImage release-assets/*.zip release-assets/*.exe release-assets/SHA256SUMS.txt release-assets/ASSURANCE-*.json)
          if [[ ${#assets[@]} -ne 8 ]]; then
            echo "Expected four native downloads, three assurance records and one combined checksum file." >&2
            exit 1
          fi
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "Acadia $RELEASE_VERSION" --generate-notes --notes-file "$RELEASE_NOTES" "${flags[@]}"
